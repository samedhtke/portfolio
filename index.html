<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f8;--ink:#14213d;--muted:#55607a;--card:#ffffff;--line:#d5dbe6;--accent:#2a6fdb}
@media(prefers-color-scheme:dark){:root{--bg:#10151f;--ink:#eef1f7;--muted:#9aa5bd;--card:#192131;--line:#2a3550}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Source Serif 4',Georgia,serif;font-size:1.1rem;line-height:1.65}
h1,h2,h3,nav,button,.tag{font-family:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif}
main{max-width:46rem;margin:0 auto;padding:0 1.25rem 4rem}
nav{display:flex;flex-wrap:wrap;gap:.25rem 1.1rem;padding:1rem 0;font-weight:500}
nav a{color:var(--muted);text-decoration:none}
nav a:hover,nav a:focus-visible{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
header{padding:3rem 0 2rem}
h1{font-size:clamp(2.6rem,10vw,5rem);line-height:1;margin:0 0 1rem;font-weight:800;letter-spacing:-.03em}
header p{font-size:1.3rem;max-width:34rem;margin:0}
.accent{color:var(--accent)}
.swatches{margin-top:1.5rem;display:flex;gap:.6rem;align-items:center;color:var(--muted);font-family:'Bricolage Grotesque',sans-serif;font-size:.95rem;flex-wrap:wrap}
.swatches button{width:2rem;height:2rem;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
section{padding:2.5rem 0;border-top:2px solid var(--line)}
h2{font-size:1.9rem;margin:0 0 1rem;letter-spacing:-.01em}
.grid{display:grid;gap:1rem}
@media(min-width:40rem){.grid.two{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:6px;padding:1.1rem 1.25rem}
.card h3{margin:0 0 .3rem;font-size:1.25rem}
.card p{margin:0 0 .6rem}
.card a{color:var(--accent);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:.5rem;padding:0;margin:0;list-style:none}
.tag{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.25rem .9rem;font-weight:500;font-size:1rem}
.links{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1rem}
.links a{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;color:#fff;background:var(--accent);padding:.6rem 1.1rem;border-radius:6px;text-decoration:none}
.links a:hover{filter:brightness(1.1)}
footer{padding-top:2rem;color:var(--muted);font-size:.95rem;border-top:2px solid var(--line)}
img{max-width:100%;height:auto}
.about{display:grid;gap:1.5rem}
@media(min-width:40rem){.about.has-photo{grid-template-columns:12rem 1fr}}
.about img{border-radius:6px;width:100%;max-width:12rem}
</style>
</head>
<body>
<main>
<nav aria-label="Sections">
  <a href="#about">About</a><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#contact">Contact</a>
</nav>

<header>
  <h1 id="name"></h1>
  <p id="tagline"></p>
  <div class="swatches" role="group" aria-label="Pick an accent colour">
    <span>Pick my colour:</span><span id="swatches"></span>
  </div>
</header>

<section id="about"><h2>About</h2><div class="about" id="aboutBox"></div></section>
<section id="projects"><h2>Projects</h2><div class="grid two" id="projectList"></div></section>
<section id="skills"><h2>Skills and interests</h2><ul class="tags" id="skillList"></ul></section>
<section id="contact"><h2>Contact</h2><p id="contactText"></p><div class="links" id="contactLinks"></div></section>
<footer id="foot"></footer>
</main>

<script>
/* ============================================================
   EDIT ONLY THIS BLOCK. Replace every value with your own words.
   ============================================================ */
const ME = {
  name: "Samedh Netke",
  tagline: "B.Tech Data Science student who likes turning messy numbers into something you can actually understand.",
  photo: "",
  about: [
    "I'm Samedh, a B.Tech student in Data Science. I like the moment a pile of confusing data suddenly turns into a clear answer, and I'm learning to make that happen with Python, statistics and machine learning.",
    "Outside of class I enjoy exploring datasets about things I care about, like sports and music, building small side projects, and learning how to explain technical ideas in plain language."
  ],
  projects: [
    { title: "Data analysis of a public dataset", text: "Cleaned a real-world dataset in Python with pandas, then used charts to find patterns and explain them in simple terms.", link: "", linkText: "" },
    { title: "Machine learning prediction model", text: "Trained and compared a few models in scikit-learn to predict an outcome, and learned how to check whether the results can be trusted.", link: "", linkText: "" },
    { title: "This portfolio website", text: "Built with plain HTML, CSS and JavaScript. Visitors can pick their own accent colour, and it works on phones and laptops.", link: "", linkText: "" }
  ],
  skills: ["Python", "pandas and NumPy", "SQL", "Data visualisation", "Machine learning basics", "Statistics", "HTML and CSS", "Git and GitHub", "Sports analytics", "Music"],
  contactText: "Want to talk data, collaborate on a project, or just say hi? Email me.",
  contacts: [
    { label: "Email me", url: "mailto:samedhnetke@gmail.com" }
  ],
  colours: ["#2a6fdb", "#e0457b", "#1f9d6b", "#e08a1e"],
  credits: "Fonts: Google Fonts (Bricolage Grotesque, Source Serif 4). Built with AI coding assistance; content is my own."
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const el = (tag, props = {}, kids = []) => {
  const e = document.createElement(tag);
  Object.assign(e, props);
  kids.forEach(k => e.append(k));
  return e;
};

document.title = ME.name + " | Portfolio";
$("name").textContent = ME.name;
$("tagline").textContent = ME.tagline;

const box = $("aboutBox");
if (ME.photo) {
  box.classList.add("has-photo");
  box.append(el("img", { src: ME.photo, alt: "Photo of " + ME.name }));
}
const txt = el("div");
ME.about.forEach(p => txt.append(el("p", { textContent: p })));
box.append(txt);

ME.projects.forEach(p => {
  const c = el("article", { className: "card" }, [
    el("h3", { textContent: p.title }),
    el("p", { textContent: p.text })
  ]);
  if (p.link) c.append(el("a", { href: p.link, textContent: p.linkText || "View project", target: "_blank", rel: "noopener" }));
  $("projectList").append(c);
});

ME.skills.forEach(s => $("skillList").append(el("li", { className: "tag", textContent: s })));
$("contactText").textContent = ME.contactText;
ME.contacts.forEach(c => $("contactLinks").append(el("a", { href: c.url, textContent: c.label, target: c.url.startsWith("mailto") ? "_self" : "_blank", rel: "noopener" })));

function setAccent(c) {
  document.documentElement.style.setProperty("--accent", c);
  try { localStorage.setItem("accent", c); } catch (e) {}
}
ME.colours.forEach(c => {
  const b = el("button", { type: "button", title: c, ariaLabel: "Use accent colour " + c });
  b.style.background = c;
  b.addEventListener("click", () => setAccent(c));
  $("swatches").append(b);
});
try { const saved = localStorage.getItem("accent"); if (saved) setAccent(saved); } catch (e) {}

$("foot").textContent = "© " + new Date().getFullYear() + " " + ME.name + (ME.credits ? ". " + ME.credits : "");
</script>
</body>
</html>
